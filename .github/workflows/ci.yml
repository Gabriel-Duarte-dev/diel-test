name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: diel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d diel"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Create env file
        run: |
          cat > .env <<'EOF'
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/diel
          JWT_SECRETS=change-me
          API_PORT=3000
          WS_CORS_ORIGIN=http://localhost:5173
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npm run db:generate

      - name: Prisma migrate
        run: npm run db:migrate

      - name: Seed database
        run: npm run db:seed

      - name: Unit tests API
        run: npm run test -w apps/api -- --runInBand

      - name: Integration tests API
        run: npm run test:integration -w apps/api

      - name: Build API
        run: npm run build -w apps/api

      - name: Build Web
        run: npm run build -w apps/web

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E Web
        run: npm run test:e2e -w apps/web
