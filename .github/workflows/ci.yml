name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: diel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d diel"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Create env file
        run: |
          cat > .env <<'ENVEOF'
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/diel
          JWT_SECRETS=change-me-for-ci-only
          API_PORT=3000
          WS_CORS_ORIGIN=http://localhost:5173
          VITE_API_URL=http://localhost:3000/api/v1
          VITE_WS_URL=http://localhost:3000/realtime
          ENVEOF

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npm run db:generate

      - name: Prisma migrate deploy
        run: npm run db:migrate:deploy -w apps/api

      - name: Seed database
        run: npm run db:seed

      - name: Typecheck workspaces
        run: npm run typecheck

      - name: Unit tests API
        run: npm run test -w apps/api

      - name: Integration tests API
        run: npm run test:integration -w apps/api

      - name: Worker tests
        run: npm run test -w apps/worker

      - name: Web unit tests
        run: npm run test:ci -w apps/web

      - name: Build API
        run: npm run build -w apps/api

      - name: Build Worker
        run: npm run build -w apps/worker

      - name: Worker ingestion smoke test
        run: |
          printf '%s\n' '{"dev_id":"IOT001","timestamp":"2026-01-15T12:00:00","GMT":-3,"samplingTime":30,"Temperature":[23.5]}' > "$RUNNER_TEMP/telemetry-smoke.jsonl"
          TELEMETRY_FILE="$RUNNER_TEMP/telemetry-smoke.jsonl" npm run start -w apps/worker

      - name: Build Web
        run: npm run build -w apps/web

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E Web
        run: npm run test:e2e -w apps/web
